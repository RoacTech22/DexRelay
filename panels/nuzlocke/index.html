<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DexRelay — Encuentros Nuzlocke</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="header-text">
            <h1>Encuentros por ruta</h1>
            <p class="subtitle">
                La mayoría de las capturas se detectan y completan
                solas (especie, nickname, ruta y si es shiny). Lo
                que no se pudo resolver automático se carga a mano
                abajo.
            </p>
        </div>

        <button
            id="reset-all-button"
            type="button"
            title="Borra roster, cementerio, encuentros y todo lo demás del Nuzlocke Tracker"
        >
            Reiniciar Nuzlocke Tracker
        </button>
    </header>

    <section id="pending-section">
        <h2>¿Pokémon Especial?</h2>
        <div id="pending-list"></div>
    </section>

    <table id="encounters-table">
        <thead>
            <tr>
                <th class="col-location">Ruta / Ubicación</th>
                <th class="col-nickname">Nickname</th>
                <th class="col-species">Especie</th>
                <th class="col-status">Estado</th>
            </tr>
        </thead>
        <tbody id="encounters-body">
        </tbody>
    </table>

    <div id="add-row">
        <input
            type="text"
            id="new-location-input"
            placeholder="Agregar otra ubicación..."
        >
        <button id="add-row-button" type="button">
            Agregar
        </button>
    </div>

    <script src="app.js"></script>

</body>

</html>
