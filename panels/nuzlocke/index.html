<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DexRelay — Encuentros Nuzlocke</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Encuentros por ruta</h1>
        <p class="subtitle">
            La mayoría de las capturas se detectan y completan
            solas (especie, nickname, ruta y si es shiny). Lo que
            no se pudo resolver automático se carga a mano abajo.
        </p>
    </header>

    <section id="pending-section">
        <h2>Capturas sin ruta asignada</h2>
        <div id="pending-list"></div>
    </section>

    <table id="encounters-table">
        <thead>
            <tr>
                <th class="col-location">Ruta / Ubicación</th>
                <th class="col-nickname">Nickname</th>
                <th class="col-species">Especie</th>
                <th class="col-status">Estado</th>
            </tr>
        </thead>
        <tbody id="encounters-body">
        </tbody>
    </table>

    <datalist id="species-datalist"></datalist>

    <div id="add-row">
        <input
            type="text"
            id="new-location-input"
            placeholder="Agregar otra ubicación..."
        >
        <button id="add-row-button" type="button">
            Agregar
        </button>
    </div>

    <script src="app.js"></script>

</body>

</html>
