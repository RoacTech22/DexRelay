<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Equipo de líder</title>
  <!-- Reusa el mismo style.css de la ventana principal (variables
       de color, .nz-mon-card-* de la Fase B, .pokemon-type-badge,
       etc.) -- esta ventana no tiene sidebar ni shell propio, es
       standalone (06/09/2026, a pedido del usuario: "que fuera una
       ventana" en vez de un modal, para poder abrir varias a la
       vez y moverlas fuera de los límites de la ventana
       principal). Ver AppWindow/Api.open_leader_team_window() en
       Python -- cada botón "Detalle de equipo" abre una instancia
       nueva de esta página como ventana nativa de pywebview. -->
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* El body de style.css trae overflow:hidden pensado para el
       shell de la app principal (que maneja su propio scroll
       interno por sección) -- acá sí hace falta que la ventana
       entera pueda scrollear si el equipo tiene varios Pokémon. */
    html, body {
      overflow: auto;
    }

    #leader-window-root {
      padding: 20px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .leader-window-title {
      font-family: "Space Grotesk", "Inter", sans-serif;
      font-size: 20px;
      margin: 0 0 4px;
    }

    .leader-window-subtitle {
      color: var(--text-dim);
      font-size: 12.5px;
      margin: 0 0 18px;
    }
  </style>
</head>
<body>
  <div id="leader-window-root">
    <h1 id="leader-window-title" class="leader-window-title">Cargando…</h1>
    <p id="leader-window-subtitle" class="leader-window-subtitle"></p>
    <div id="leader-window-cards" class="nz-leader-window-cards"></div>
  </div>

  <!-- ============ MODAL: detalle de movimiento (07/09/2026) ============ -->
  <div id="pkm-modal-move" class="nz-modal-overlay" hidden>
    <div class="nz-modal nz-modal-narrow">
      <div class="nz-modal-header">
        <h3 id="pkm-move-modal-title">Movimiento</h3>
        <button class="nz-modal-close" data-close-modal="pkm-modal-move"><svg class="nz-close-icon"
            viewBox="0 0 150.02 150.04" xmlns="http://www.w3.org/2000/svg">
            <path fill="currentColor"
              d="M77.38,0c6.07.18,9.99,5.23,11.32,10.77l.1,50.24.21.22h49.19c6.05.83,11.53,4.97,11.82,11.42v4.69c-1.2,5.53-5.61,10-11.46,10.84h-50.33s-.15,50.54-.15,50.54c0,3.31-2.26,6.09-4.49,8.11-4.9,4.46-12.39,4.17-17.3-.08-2.19-2.28-4.36-4.87-4.36-8.26l-.08-50.31H11.33c-4.98-1.07-8.44-3.71-10.48-8.45-1.7-4.6-.84-9.61,2.23-13.27,2.4-2.34,4.97-4.55,8.46-4.55l50.31-.1V11.46c.82-5.87,5.3-10.19,10.83-11.46h4.69Z" />
          </svg></button>
      </div>
      <div class="nz-modal-body">
        <div class="pkm-modal-top-row">
          <span id="pkm-move-modal-type" class="pokemon-type-badge"></span>
          <span id="pkm-move-modal-category" class="pkm-modal-category-badge"></span>
        </div>
        <div class="pkm-modal-stats-row">
          <div class="pkm-modal-stat">
            <span class="pkm-modal-stat-label">Potencia</span>
            <span id="pkm-move-modal-power" class="pkm-modal-stat-value">—</span>
          </div>
          <div class="pkm-modal-stat">
            <span class="pkm-modal-stat-label">Precisión</span>
            <span id="pkm-move-modal-accuracy" class="pkm-modal-stat-value">—</span>
          </div>
          <div class="pkm-modal-stat">
            <span class="pkm-modal-stat-label">PP</span>
            <span id="pkm-move-modal-pp" class="pkm-modal-stat-value">—</span>
          </div>
        </div>
        <p id="pkm-move-modal-description" class="pkm-modal-description"></p>
      </div>
    </div>
  </div>

  <!-- ============ MODAL: detalle de habilidad (07/09/2026) ============ -->
  <div id="pkm-modal-ability" class="nz-modal-overlay" hidden>
    <div class="nz-modal nz-modal-narrow">
      <div class="nz-modal-header">
        <h3 id="pkm-ability-modal-title">Habilidad</h3>

      </div>
      <div class="nz-modal-body">
        <p id="pkm-ability-modal-description" class="pkm-modal-description"></p>
      </div>
    </div>
  </div>
