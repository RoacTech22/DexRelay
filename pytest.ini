[pytest]
# Bloque 2 (guía siguiente versión, 22/09/2026): con esto,
# "python -m pytest" desde la raíz del proyecto corre TODA la
# suite de una vez -- los tests nuevos de tests/ y, gratis, los
# ~24 scripts de tools/probes/**/test_*.py que ya seguían el
# patrón de pytest (funciones test_* con `assert` plano) pero se
# corrían a mano uno por uno. No mueve ni toca esos archivos --
# siguen viviendo en tools/probes/ (regla del proyecto: los probes
# nunca se borran ni se reubican).
testpaths =
    tests
    tools/probes

# Confirmado sin colisiones de nombre de archivo entre las
# distintas subcarpetas de tools/probes/ (memory/, party/,
# badges/, la raíz) -- el modo de import por defecto de pytest
# ("prepend") alcanza sin configuración extra.

# Bloque 2 (22/09/2026, hallazgo al correr la suite completa por
# primera vez): test_boxed_capture_baseline.py prueba una máquina
# de estados (TOTAL_CAUGHT_ADDRESS + LAST_CAUGHT_ADDRESS) que ya
# no existe en Runtime -- reemplazada por read_boxes_range() en el
# commit 379dfa0 (07/09/2026). El propio test_box_scan_capture.py,
# de ESE MISMO commit, dice en su docstring que este archivo
# "(borrado -- probaba el Intento 4 ... que ya no existe en
# Runtime)" -- la eliminación real se perdió, probablemente en el
# merge conflictivo de git documentado en la sección 6.13 del
# Documento Maestro (19/09/2026). No se toca ni se borra acá (regla
# del proyecto: los probes nunca se borran solos) -- se excluye
# de la recolección de pytest hasta que decidas si confirmarlo
# como borrado (lo que ya documentaba el propio código) o
# conservarlo igual.
addopts = --ignore=tools/probes/memory/test_boxed_capture_baseline.py
